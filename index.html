<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi Digital - Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.4/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="student-page">
    <div class="att-box">
      <div class="att-header">
        <h1>Admin LevelUp</h1>
        <p>Sistem Absensi Digital</p>
      </div>
      <div class="att-body" id="student-content">
        <p style="text-align:center;">Memuat sistem absensi...</p>
      </div>
    </div>
  </div>
  <div class="toast-container" id="toasts"></div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      // Inisialisasi tampilan siswa
      document.getElementById('student-content').innerHTML = `
        <button class="opt-btn" onclick="startCamera()">
          <h3>Absen Presensi Wajah</h3>
          <p>Lakukan pemindaian wajah & lokasi</p>
        </button>
      `;
    });
  </script>
</body>
</html>
